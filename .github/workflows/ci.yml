# Risa's CI: `pnpm check` (prettier, eslint, the docs budget and headings, the tests) on GitHub's
# own runners. Its name is the one `risa ci` filters runs by (ci/ci-io.mjs's
# WORKFLOW_NAME). `risa ci run <tier>` starts it by pushing the commit to
# ci/<tier>/<branch> (risa-tiers.json's refPrefix), with no dispatch inputs; the Actions
# tab's "Run workflow" button starts it by hand. Pass or fail, it uploads the verdict
# `risa ci run --wait` reads (ci/write-verdict.mjs; the artifact's name is ci/ci-io.mjs's
# VERDICT_ARTIFACT, its file VERDICT_FILE).
# Every action is pinned to a full commit SHA, its version in the comment.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history and its tags: docs:headings finds the newest v* tag reachable
        # from HEAD (`git tag --merged HEAD`) and reads the docs at it (`git show`).
        with:
          fetch-depth: 0
      # pnpm's version is package.json's packageManager (exact).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests commit in throwaway repos in the OS temp dir.
      - run: |
          git config --global user.name "Risa CI"
          git config --global user.email "ci@example.invalid"
      - run: pnpm check
        id: check
        env:
          RISA_CI_REPORT: ${{ runner.temp }}/vitest.json
      - run: node ci/write-verdict.mjs
        if: always()
        env:
          VERDICT_OUT: ${{ runner.temp }}/verdict/verdict.json
          VERDICT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          VERDICT_RUN_ID: ${{ github.run_id }}
          VERDICT_REF: ${{ github.ref_name }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          VERDICT_REPORT: ${{ runner.temp }}/vitest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
