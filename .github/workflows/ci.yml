# Risa's CI: `pnpm check` (prettier, eslint, the docs budget, the tests) on GitHub's
# own runners. Its name is the one `risa ci` filters runs by (ci/ci-io.mjs's
# WORKFLOW_NAME). `risa ci run <tier>` starts it by pushing the commit to
# ci/<tier>/<branch> (risa-tiers.json's refPrefix), with no dispatch inputs; the Actions
# tab's "Run workflow" button starts it by hand. It writes no verdict artifact yet,
# so `risa ci run --wait` reads such a run as unknown.
# Every action is pinned to a full commit SHA, its version in the comment.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's version is package.json's packageManager (exact).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests commit in throwaway repos in the OS temp dir.
      - run: |
          git config --global user.name "Risa CI"
          git config --global user.email "ci@example.invalid"
      - run: pnpm check
